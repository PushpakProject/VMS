# Production on GCP: GCS storage, structured JSON logs (Cloud Logging), secure cookies.
logging:
  structured:
    format:
      console: ecs

vms:
  auth:
    cookie-secure: true
    # Reviewer accounts are provisioned; public sign-up stays off unless explicitly enabled.
    registration-enabled: ${VMS_REGISTRATION_ENABLED:false}
  storage:
    provider: gcs
