spring:
  application:
    name: vms-api
  datasource:
    url: ${VMS_DB_URL:jdbc:postgresql://localhost:5432/vms}
    username: ${VMS_DB_USER:vms}
    password: ${VMS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${VMS_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
  servlet:
    multipart:
      enabled: false
  mvc:
    formcontent:
      filter:
        # JSON-only API: never consume PUT bodies as form parameters (upload pieces are binary).
        enabled: false

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ${VMS_LOG_FORMAT:}

vms:
  auth:
    jwt-secret: ${VMS_JWT_SECRET}
    jwt-issuer: vms-api
    access-token-ttl: ${VMS_JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${VMS_REFRESH_TTL:P7D}
    refresh-rotation-grace: PT10S
    cookie-secure: ${VMS_COOKIE_SECURE:true}
    cors-allowed-origins: ${VMS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    max-failed-logins: 5
    lock-duration: PT15M
    google:
      client-id: ${VMS_GOOGLE_CLIENT_ID:}
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  recording:
    max-duration-sec: ${VMS_MAX_DURATION_SEC:120}
    warn-at-sec: ${VMS_WARN_AT_SEC:105}
    duration-tolerance-sec: ${VMS_DURATION_TOLERANCE_SEC:10}
    max-upload-bytes: ${VMS_MAX_UPLOAD_BYTES:104857600}
    allowed-content-types: video/webm,video/mp4
    video-bits-per-second: ${VMS_VIDEO_BITS_PER_SECOND:2500000}
    video-width: ${VMS_VIDEO_WIDTH:1280}
    video-height: ${VMS_VIDEO_HEIGHT:720}
    upload-url-ttl: ${VMS_UPLOAD_URL_TTL:PT15M}
    playback-url-ttl: ${VMS_PLAYBACK_URL_TTL:PT5M}
  upload:
    protocol: ${VMS_UPLOAD_PROTOCOL:RESUMABLE}
    chunk-size-bytes: ${VMS_UPLOAD_CHUNK_BYTES:4194304}
    session-ttl: P6D
  storage:
    provider: ${VMS_STORAGE_PROVIDER:local}
    bucket: ${VMS_GCS_BUCKET:}
    local-dir: ${VMS_LOCAL_STORAGE_DIR:./.data/storage}
    local-signing-key: ${VMS_LOCAL_SIGNING_KEY:}
  kafka:
    video-uploaded-topic: video.uploaded.v1
    watermark-result-topic: video.watermark.result.v1
    partitions: ${VMS_KAFKA_PARTITIONS:3}
    replication-factor: ${VMS_KAFKA_REPLICATION_FACTOR:1}
  reconciler:
    stale-after: ${VMS_RECONCILER_STALE_AFTER:PT30M}
    abandon-after: ${VMS_ABANDON_AFTER:P7D}
    interval: PT5M
  demo:
    user-email: ${VMS_DEMO_USER_EMAIL:}
    user-password: ${VMS_DEMO_USER_PASSWORD:}
    admin-email: ${VMS_DEMO_ADMIN_EMAIL:}
    admin-password: ${VMS_DEMO_ADMIN_PASSWORD:}
