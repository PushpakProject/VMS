# Shared security headers (included by the site configs).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Scripts only from us and Google Sign-In; media/uploads to GCS via signed URLs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com; connect-src 'self' https://storage.googleapis.com https://accounts.google.com; media-src 'self' blob: https://storage.googleapis.com; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
